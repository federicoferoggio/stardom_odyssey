<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Map</title>
    <link rel="stylesheet" href="map.css">
</head>

<body>

    <nav class="navigation-menu"></nav>
    <script src="nav.js"></script>
    <link rel="stylesheet" href="nav.css">

    <div id="controls">
        <label for="tickSlider" id="tick-label">Mese: <span id="tick-display">0</span></label>
        <button id="tickPrevBtn">◀</button>
        <input type="range" id="tickSlider" min="0" max="100" step="0.01" value="0">
        <button id="tickNextBtn">▶</button>
        <button id="resetBtn">🕰️ Corrente</button>
        <button id="rulerBtn">📏 Righello</button>
        <div id="searchWrapper">
            <span id="searchIcon">🔍</span>
            <input type="text" id="searchInput" placeholder="Cerca…" autocomplete="off">
            <div id="searchResults"></div>
        </div>
    </div>

    <div id="map-container">
        <svg id="solar-svg" xmlns="http://www.w3.org/2000/svg">
            <defs id="svg-defs">
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="30%" stop-color="#ffe090" />
                    <stop offset="70%" stop-color="#ff8800" />
                    <stop offset="100%" stop-color="#cc2200" stop-opacity="0" />
                </radialGradient>
                <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="glow-soft" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="glow-moon" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            <g id="bg-stars"></g>
            <g id="orbit-layer"></g>
            <g id="path-layer"></g>
            <g id="body-layer"></g>
        </svg>
    </div>

    <div id="info-tab">
        <div id="info-handle">
            <span class="drag-bar"></span>
            <span id="info-handle-label">⬡ Seleziona un corpo</span>
            <span id="info-toggle-label" style="margin-left:4px;font-size:10px;color:#444">▶ apri</span>
        </div>
        <div id="info-body">
            <h2 id="info-name">—</h2>
            <div class="owner" id="info-owner"></div>
            <div class="desc" id="info-desc">—</div>
            <div class="meta" id="info-meta"></div>
        </div>
    </div>

    <div id="ruler-tooltip"></div>
    <div id="debug"></div>

    <div id="assets-tab">
        <div id="assets-handle">
            <span class="drag-bar"></span>
            📊 Distribuzione delle Risorse
            <span id="assets-toggle-label" style="margin-left:4px;font-size:10px;color:#444">▲ apri</span>
        </div>
        <div id="assets-body">
            <h3>Risorse per tipo</h3>
            <div class="assets-grid" id="assets-grid"></div>
        </div>
    </div>
    <div id="craft-tab">
        <div id="craft-handle">
            <span class="drag-bar"></span>
            <span id="craft-handle-label">⚗ Asset Generabili</span>
            <span id="craft-toggle-label" style="margin-left:4px;font-size:10px;color:#444">▶ apri</span>
        </div>
        <div id="craft-body">
            <div id="craft-search-wrapper">
                <span id="craft-search-icon">🔍</span>
                <input type="text" id="craft-search-input" placeholder="Cerca asset…" autocomplete="off">
            </div>
            <div id="craft-empty"></div>
            <div id="craft-list"></div>
        </div>
    </div>
    <script src="map.js"></script>
</body>

</html>
