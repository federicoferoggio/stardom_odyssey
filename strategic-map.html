<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Map</title>
    <link rel="stylesheet" href="strategic-map.css">
</head>

<body>

    <nav class="navigation-menu"></nav>
    <script src="nav.js"></script>
    <link rel="stylesheet" href="nav.css">

    <div id="controls">
        <label for="tickSlider" id="tick-label">Mese: <span id="tick-display">0</span></label>
        <button id="tickPrevBtn">◀</button>
        <input type="range" id="tickSlider" min="0" max="100" step="0.01" value="0">
        <button id="tickNextBtn">▶</button>
        <button id="resetBtn">🕰️ Corrente</button>
        <button id="rulerBtn">📏 Righello</button>
        <div id="searchWrapper">
            <span id="searchIcon">🔍</span>
            <input type="text" id="searchInput" placeholder="Cerca…" autocomplete="off">
            <div id="searchResults"></div>
        </div>
    </div>

    <div id="map-container">
        <svg id="solar-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <defs id="svg-defs">
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="30%" stop-color="#ffe090" />
                    <stop offset="70%" stop-color="#ff8800" />
                    <stop offset="100%" stop-color="#cc2200" stop-opacity="0" />
                </radialGradient>
                <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="glow-soft" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="glow-moon" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            <g id="bg-stars"></g>
            <g id="orbit-layer"></g>
            <g id="path-layer"></g>
            <g id="body-layer"></g>
        </svg>
    </div>

    <!-- ── UNIFIED TOP TOOLBAR ─────────────────────────────────────────────────── -->
    <div id="top-toolbar">
        <button id="toolbar-families-btn" class="toolbar-btn" data-panel="families">🏛 Famiglie</button>
        <button id="toolbar-resources-btn" class="toolbar-btn" data-panel="resources">📦 Risorse &amp; Asset</button>
        <button id="toolbar-info-btn" class="toolbar-btn" data-panel="info">ℹ Info</button>
        <button id="toolbar-timeline-btn" class="toolbar-btn" data-panel="timeline">🕰 Timeline</button>
    </div>

    <div id="top-toolbar-panel">
        <div id="families-panel" class="toolbar-dropdown">
            <div id="families-list"></div>
        </div>

        <div id="resources-panel" class="toolbar-dropdown">
            <div id="resources-subtabs">
                <button class="res-subtab-btn active" data-subtab="atlas">🗺 Atlante</button>
                <button class="res-subtab-btn" data-subtab="craft">⚗ Craftable</button>
            </div>
            <div id="resources-search-wrapper">
                <span id="resources-search-icon">🔍</span>
                <input type="text" id="resources-search-input" placeholder="Cerca risorsa o asset…" autocomplete="off">
            </div>
            <div id="atlas-panel" class="res-subtab-panel active">
                <div id="atlas-list"></div>
            </div>
            <div id="craft-panel" class="res-subtab-panel">
                <div id="craft-empty"></div>
                <div id="craft-list"></div>
            </div>
        </div>

        <div id="info-panel" class="toolbar-dropdown">
            <h2 id="info-name">—</h2>
            <div class="owner" id="info-owner"></div>
            <div class="desc" id="info-desc">—</div>
            <div class="meta" id="info-meta"></div>
            <div id="info-composition"></div>
            <div id="info-bonuses"></div>
            <div id="info-localized-assets"></div>
            <div id="info-family-quickview"></div>
        </div>

        <div id="timeline-panel" class="toolbar-dropdown">
            <div id="timeline-panel-nav">
                <button id="timeline-prev-btn" title="Mese precedente">◀</button>
                <span id="timeline-panel-month"></span>
                <button id="timeline-next-btn" title="Mese successivo">▶</button>
            </div>
            <h2 id="timeline-panel-title">—</h2>
            <div id="timeline-panel-events"></div>
        </div>
    </div>

    <div id="ruler-tooltip"></div>
    <div id="gm-toast"></div>
    <div id="data-error-banner"></div>

    <!-- ── FAMILY / EMPIRE SCREEN OVERLAY ─────────────────────────────────────── -->
    <div id="family-overlay">
        <div id="family-overlay-backdrop"></div>
        <div id="family-overlay-panel">
            <button id="family-overlay-close" title="Chiudi">✕</button>

            <div id="family-overlay-header">
                <img id="family-crest" src="" alt="">
                <div id="family-header-text">
                    <h1 id="family-name">—</h1>
                    <div id="family-motto"></div>
                    <div id="family-government">—</div>
                    <div id="family-planet">—</div>
                </div>
            </div>

            <div id="family-infiltration"></div>

            <p id="family-history"></p>

            <div id="family-stats-row"></div>

            <div id="family-fleet-warning"></div>

            <p id="family-description"></p>

            <div class="family-section">
                <h2>Leader di Famiglia</h2>
                <div id="family-leaders-row"></div>
            </div>

            <div class="family-section" id="family-bonuses-section">
                <h2>Bonus Attivi <span class="gm-only-tag">solo GM</span></h2>
                <div id="family-active-bonuses"></div>
            </div>

            <div class="family-section">
                <h2>Risorse Controllate</h2>
                <div id="family-resources-summary"></div>
            </div>

            <div class="family-section">
                <h2>Flotte</h2>
                <div id="family-fleet-locations"></div>
            </div>

            <div class="family-section">
                <h2>Territori Controllati</h2>
                <div id="family-territories-list"></div>
            </div>

            <div class="family-section">
                <h2>Trattati</h2>
                <div id="family-treaties-list"></div>
            </div>

            <div class="family-section">
                <h2>Asset</h2>
                <h3 class="family-subsection-label">Craftabili (con le risorse attuali)</h3>
                <div id="family-craftable-list" class="family-asset-list"></div>
                <h3 class="family-subsection-label">Unici</h3>
                <div id="family-unique-assets-list" class="family-asset-list"></div>
            </div>

            <div class="family-section">
                <h2>Opinione verso le altre famiglie</h2>
                <div id="family-opinions-list"></div>
            </div>
        </div>
    </div>

    <script src="strategic-map.js"></script>
</body>

</html>
